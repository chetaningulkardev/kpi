name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kpi_test
          POSTGRES_USER: kpi_user
          POSTGRES_PASSWORD: kpi_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kpi_user -d kpi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/kpi_test
      DB_USERNAME: kpi_user
      DB_PASSWORD: kpi_test_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Run backend tests
        run: ./mvnw -B -Dfrontend.skip=true test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:audit
      - name: Upload UI audit failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit-results
          path: frontend/audit-results/
          if-no-files-found: ignore
