# Test-only overrides.
#
# Spring Boot loads application.properties in addition to application.yaml and
# gives .properties the higher precedence, so this supplements the main config
# rather than replacing it — the datasource, Flyway and JPA settings all still
# apply.
#
# JwtTokenProvider refuses to start without a signing key of at least 64 bytes.
# This value exists only so the @SpringBootTest context can load; it is not used
# by any deployed environment, which must supply JWT_SECRET.
jwt.secret=test-only-signing-key-not-used-outside-the-test-suite-0123456789-abcdefghijklmnop
BOOTSTRAP_ADMIN_EMAIL=test-admin@example.invalid
BOOTSTRAP_ADMIN_PASSWORD=test-only-bootstrap-password
